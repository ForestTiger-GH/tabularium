name: Temporary FNS source structure probe
on:
  push:
    branches: [feat/fns-sme-pipeline-20261111]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fns-source-probe.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run new offline FNS tests
        run: |
          python -m unittest discover -s tests -p 'test_capture_fns_sme.py' -v
          python -m unittest discover -s _mw/work/publication-monitor/tests -p 'test_fns_sme_pipeline.py' -v
      - name: Inspect public FNS response structure without saving source
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from urllib.error import URLError, HTTPError
          import json, zipfile, io, xml.etree.ElementTree as ET
          def fetch(u, data=None):
              try:
                  req = Request(u, data=data, headers={'User-Agent':'Tabularium-Research/1.0','Accept-Encoding':'identity','Content-Type':'application/x-www-form-urlencoded'})
                  with urlopen(req, timeout=32) as r:
                      typ=r.headers.get('Content-Type','')
                      print('SOURCE',r.status,r.geturl(),typ)
                      raw=r.read(7_000_000)
                      return raw, typ
              except Exception as e:
                  print('FETCH_ERROR',type(e).__name__,str(e)[:140]);return None,None
          for date in ('10.11.2026','10.01.2025','01.08.2016'):
              print('DATE',date)
              raw,typ=fetch('https://rmsp.nalog.ru/statistics-proc.json',urlencode({'statDate':date}).encode())
              if raw:
                  try:
                      obj=json.loads(raw)
                      print('JSON_TOP',type(obj).__name__,len(obj))
                      if isinstance(obj,dict):
                          print('TOP_KEYS', sorted(obj))
                          arr=obj.get('data',[])
                      else: arr=obj
                      if isinstance(arr,list):
                          lv={}
                          for row in arr:
                              if isinstance(row,dict):
                                  key=str(row.get('cnt_level'))
                                  lv[key]=lv.get(key,0)+1
                          print('LEVEL_COUNTS',lv)
                          for row in arr:
                              if isinstance(row,dict) and row.get('ssrf') not in (None,''):
                                  print('REGION_KEYS', sorted(row))
                                  print('REGION_SAMPLE', json.dumps(row,ensure_ascii=False)[:5000])
                                  break
                  except Exception as e: print('JSON_ERROR',repr(e),repr(raw[:100]))
              raw,typ=fetch('https://rmsp.nalog.ru/statistics.xlsx?'+urlencode({'fo':'','level':'2','ssrf':'','statDate':date}))
              if raw:
                  try:
                      with zipfile.ZipFile(io.BytesIO(raw)) as z:
                          names=z.namelist()
                          print('XLSX_MEMBERS',len(names),'SHEETS',[n for n in names if n.startswith('xl/worksheets/sheet')][:5])
                          ns='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
                          shared=[]
                          if 'xl/sharedStrings.xml' in names:
                              for item in ET.fromstring(z.read('xl/sharedStrings.xml')).findall(ns+'si'):
                                  shared.append(''.join(t.text or '' for t in item.iter(ns+'t')))
                          for path in [n for n in names if n.startswith('xl/worksheets/sheet') and n.endswith('.xml')][:2]:
                              root=ET.fromstring(z.read(path));dat=root.find(ns+'sheetData')
                              if dat is None: continue
                              print('SHEET',path)
                              for row in list(dat)[:14]:
                                  vals=[]
                                  for cell in list(row)[:14]:
                                      v=cell.find(ns+'v')
                                      s='' if v is None else v.text or ''
                                      if cell.get('t')=='s' and s.isdigit():s=shared[int(s)]
                                      if cell.get('t')=='inlineStr':
                                          s=''.join(t.text or '' for t in cell.iter(ns+'t'))
                                      if s:vals.append([cell.get('r'),s[:80]])
                                  print('ROW',row.get('r'),vals)
                  except Exception as e: print('XLSX_ERROR',repr(e),repr(raw[:70]))
          print('SELECTOR_DISCOVERY')
          from html.parser import HTMLParser
          class Opt(HTMLParser):
              def __init__(self):super().__init__();self.items=[];self.v=None;self.s=[]
              def handle_starttag(self,tag,a):
                  if tag=='option':self.v=dict(a).get('value');self.s=[]
              def handle_data(self,data):
                  if self.v is not None:self.s.append(data)
              def handle_endtag(self,tag):
                  if tag=='option' and self.v is not None:
                      self.items.append((self.v,''.join(self.s).strip()));self.v=None
          page,typ=fetch('https://rmsp.nalog.ru/statistics.html')
          if page:
              from datetime import datetime
              p=Opt();p.feed(page.decode('utf-8','replace'))
              print('OPTIONS',len(p.items),p.items[:6],p.items[-6:])
              import re
              dates=re.findall(r'(?:0[1-9]|[12][0-9]|3[01])\.(?:0[1-9]|1[0-2])\.20\d{2}',page.decode('utf-8','replace'))
              print('DATES_IN_PAGE',len(set(dates)), sorted(set(dates))[:6],sorted(set(dates))[-6:])
          print('REGIONAL_XLSX')
          raw,typ=fetch('https://rmsp.nalog.ru/statistics.xlsx?'+urlencode({'fo':'1','level':'0','ssrf':'31','statDate':'10.11.2026'}))
          if raw:
              try:
                  z=zipfile.ZipFile(io.BytesIO(raw)); ns='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
                  ss=[]
                  if 'xl/sharedStrings.xml' in z.namelist():
                      for si in ET.fromstring(z.read('xl/sharedStrings.xml')).findall(ns+'si'):
                          ss.append(''.join(t.text or '' for t in si.iter(ns+'t')))
                  dat=ET.fromstring(z.read('xl/worksheets/sheet1.xml')).find(ns+'sheetData')
                  for row in list(dat)[:37]:
                      cells=[]
                      for cell in row:
                          v=cell.find(ns+'v');val='' if v is None else v.text or ''
                          if cell.get('t')=='s':val=ss[int(val)]
                          if cell.get('t')=='inlineStr':val=''.join(t.text or '' for t in cell.iter(ns+'t'))
                          if val:cells.append((cell.get('r'),val[:95]))
                      print('REG_ROW',row.get('r'),cells)
              except Exception as e:print('REG_XLSX_ERROR',repr(e))
          PY
