name: One-shot FNS 1-YUR final corpus audit (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-final-audit-once.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate all dated files and event log
        run: python _mw/work/publication-monitor/fns_1yur_pipeline.py verify
      - name: Ensure no remaining registration-record columns
        run: python scripts/repair_fns_1yur_history_scope.py --dry-run
      - name: Independently verify file/event provenance, geography, and sparse measures
        run: |
          python - <<'PY'
          import csv,hashlib,json,sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0,"scripts")
          import capture_fns_1yur as form
          import capture_fns_1yur_history as historical
          root=form.CORPUS
          files=sorted(root.glob("*/*_1-YUR.csv"))
          assert len(files)==178, f"Unexpected corpus size: {len(files)}"
          stream=Path("_mw/work/publication-monitor/fns_1yur_events.jsonl")
          events=[json.loads(line) for line in stream.read_text(encoding="utf-8").splitlines() if line]
          last_hash={}
          baselines={}
          corrections=Counter()
          for event in events:
              kind=event["type"]
              if kind in ("BASELINE_IMPORTED","PUBLISHED_NEW","PUBLISHED_UPDATED","BASELINE_CORRECTED"):
                  day=event["reference_date"]
                  last_hash[day]=event["csv_sha256"]
                  if kind=="BASELINE_IMPORTED":
                      assert day not in baselines
                      baselines[day]=event
                  elif kind=="BASELINE_CORRECTED":
                      corrections[day]+=1
          assert len(corrections)==60, f"Unexpected corrected dates: {len(corrections)}"
          assert all(v==1 for v in corrections.values())
          observed={}
          metric_prefixes=set()
          total_rows=0
          for path in files:
              day=path.name[:10]
              data=path.read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              assert digest==last_hash.get(day), ("PROVENANCE_HASH_MISMATCH",path, digest,last_hash.get(day))
              columns,geography=form.read_csv(data)
              rows=list(geography)
              assert rows[0]==("","Российская Федерация"), ("RF_NOT_FIRST",path,rows[0])
              assert len(rows)>=90, ("GEOGRAPHY_TOO_SHORT",path,len(rows))
              assert ("", "Центральный федеральный округ") in geography, ("NO_DISTRICT",path)
              assert path.parent.name==day[:4], ("YEAR_DIRECTORY_WRONG",path)
              prefixes={field.split("_",1)[0] for field in columns[2:]}
              metric_prefixes.update(prefixes)
              assert prefixes.issubset({"c01","c08","c09","c11","c12","c13"}), ("UNEXPECTED_METRIC",path,prefixes)
              assert "c01" in prefixes
              if day in baselines:
                  source=baselines[day]
                  labels=source.get("source_kind_labels",{})
                  coverage=source["source_kind_metric_coverage"]
                  original_map=source["source_indicator_map"]
                  excluded={key for key,value in labels.items() if historical.is_registration_record_label(value)}
                  assert not any(field.rsplit("_",1)[1] in excluded for field in columns[2:]), ("SOURCE_REPORTED_REGISTRATION_RECORD_FIELD",path,excluded)
                  expected={}
                  for meaning,codes in coverage.items():
                      prefix=original_map[meaning]["csv_prefix"]
                      expected[prefix]=set(codes)-excluded
                  actual={}
                  for column in columns[2:]:
                      prefix,code=column.split("_",1)
                      actual.setdefault(prefix,set()).add(code)
                  assert expected==actual, ("SOURCE_METRIC_COVERAGE_MISMATCH",path,expected,actual)
              observed[day]=len(rows)
              total_rows+=len(rows)
          assert set(last_hash)==set(observed), ("EVENT_DATE_COVERAGE_DIFFERENCE",
                                                set(last_hash)^set(observed))
          assert observed["2026-11-01"]==97, observed["2026-11-01"]
          assert "2015-07-01" not in observed
          june_header=next(csv.reader(open(root/"2019/2019-06-01_1-YUR.csv",encoding="utf-8")))
          assert len(june_header)>2
          assert {x.split("_",1)[1] for x in june_header[2:]}=={"1000"}, june_header
          years=Counter(d[:4] for d in observed)
          assert years["2015"]==11 and years["2013"]==12 and years["2026"]==11, years
          print("FNS_1YUR_FINAL_AUDIT_OK",json.dumps({
              "csv_files":len(files),"source_geography_rows":total_rows,
              "dated_events":len(last_hash),"corrected_legacy_dates":len(corrections),
              "historical_missing_values_invented":False,
              "indicators_present":sorted(metric_prefixes),
              "by_year":dict(sorted(years.items())),
          },ensure_ascii=False,sort_keys=True))
          PY
