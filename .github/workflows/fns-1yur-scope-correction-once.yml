name: One-shot FNS 1-YUR historical source-scope correction (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-scope-correction-once.yml']
permissions:
  contents: write
concurrency:
  group: tabularium-publication-monitor
  cancel-in-progress: false
  queue: single
jobs:
  correct:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out latest public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify source-kind eligibility and exact CSV retention
        run: |
          python -m unittest discover -s tests -p 'test_repair_fns_1yur_history_scope.py' -q
          python -m unittest discover -s tests -p 'test_capture_fns_1yur_history.py' -q
      - name: Audit existing historical registration-record columns
        run: python scripts/repair_fns_1yur_history_scope.py --dry-run
      - name: Remove only source-labelled registration-record columns
        run: python scripts/repair_fns_1yur_history_scope.py
      - name: Verify idempotence of completed corrections
        run: python scripts/repair_fns_1yur_history_scope.py --dry-run
