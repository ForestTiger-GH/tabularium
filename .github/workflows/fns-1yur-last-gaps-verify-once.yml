name: One-shot FNS 1-YUR last historical gaps validation (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-last-gaps-verify-once.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install source-appropriate readers
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements_fns_1yur.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libarchive-tools
      - name: Offline extraction and scope regression tests
        run: |
          python -m unittest discover -s tests -p 'test_capture_fns_1yur*.py' -q
          python -m unittest discover -s tests -p 'test_repair_fns_1yur_history_scope.py' -q
          python -m unittest discover -s _mw/work/publication-monitor/tests -p 'test_fns_1yur_pipeline.py' -q
      - name: Refuse July 2015 Part I publishing section 2 instead of source stocks
        run: |
          python - <<'PY'
          import sys
          from datetime import date
          sys.path.insert(0,"scripts")
          import capture_fns_1yur_history as h
          d=date(2015,7,1)
          r,_=h.discover(d,d)
          page,url=r[d]
          try:
              h.capture(d,page,url)
          except h.HistoryError as exc:
              if str(exc)!="SOURCE_SECTION_ONE_NOT_PUBLISHED":
                  raise
              print("EXPECTED_NO_STOCK_SOURCE_SECTION",d,url)
          else:
              raise SystemExit("Invalid section 2 accepted as legal-entity stock")
          PY
      - name: April 2018 OOXML mislabeled XLS
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2018-04-01 --to-date 2018-04-01 --dry-run
      - name: February 2019 OOXML mislabeled XLS
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2019-02-01 --to-date 2019-02-01 --dry-run
      - name: June 2019 source-incomplete per-kind geographic data
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2019-06-01 --to-date 2019-06-01 --dry-run
      - name: Recover September 2016 archive mislabeled ZIP while actually RAR
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2016-09-01 --to-date 2016-09-01 --dry-run

      - name: Inspect official July 2015 workbook sheets without modifying data
        if: always()
        run: |
          python - <<'PY'
          import sys
          from datetime import date
          sys.path.insert(0,"scripts")
          import capture_fns_1yur_history as h
          day=date(2015,7,1)
          releases,_=h.discover(day,day)
          page,asset=releases[day]
          content,member,outer=h.workbook_from_asset(h.retrieve(asset),asset)
          book=h.open_source_workbook(content)
          try:
              print("FNS_2015_07_STRUCTURE",member,outer,len(book.sheet_names()),
                    book.sheet_names()[:90])
              first=book.sheet_by_name(book.sheet_names()[0])
              print("FNS_2015_07_FIRST_SHEET",first.name,first.nrows,first.ncols)
              for row in range(min(16,first.nrows)):
                  print("FNS_2015_07_FIRST_ROW",row+1,
                        [str(first.cell_value(row,col))[:90]
                         for col in range(min(6,first.ncols))])
          finally:
              book.release_resources()
          PY
