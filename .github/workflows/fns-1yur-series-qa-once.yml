name: One-shot visual QA of FNS 1-YUR 2012-2026 (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-series-qa-once.yml']
permissions:
  contents: write
concurrency:
  group: tabularium-fns-series-qa-once
  cancel-in-progress: false
jobs:
  graphs:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install charting library only for development-layer QA
        run: python -m pip install --disable-pip-version-check matplotlib==3.10.7
      - name: Plot monthly source observations and scan for anomalies
        run: python scripts/audit_fns_1yur_series.py
      - name: Publish reproducible QA figures without changing source CSVs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- _mw/work/fns-1yur-series-audit-2026-11-11/
          git commit -m 'research(fns): publish 2012-2026 1-YUR diagnostic graphs and anomaly report'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
