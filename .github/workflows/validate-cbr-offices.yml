name: Validate CBR offices automation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-cbr-offices.yml'
      - '.github/workflows/validate-cbr-offices.yml'
      - '.github/workflows/check-cbr-offices.yml'
      - 'scripts/capture_cbr_offices.py'
      - 'scripts/capture_cbr_offices_reg.py'
      - 'tests/test_capture_cbr_offices_reg.py'
      - '.github/workflows/capture-cbr-offices-reg.yml'
      - 'tests/test_capture_cbr_offices.py'
      - 'tests/fixtures/cbr-offices/**'
  pull_request:
    paths:
      - '.github/workflows/capture-cbr-offices.yml'
      - '.github/workflows/validate-cbr-offices.yml'
      - '.github/workflows/check-cbr-offices.yml'
      - 'scripts/capture_cbr_offices.py'
      - 'scripts/capture_cbr_offices_reg.py'
      - 'tests/test_capture_cbr_offices_reg.py'
      - '.github/workflows/capture-cbr-offices-reg.yml'
      - 'tests/test_capture_cbr_offices.py'
      - 'tests/fixtures/cbr-offices/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'ForestTiger-GH/tabularium' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout proposed commit (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Set up Go 1.25 for pinned actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25'
          cache: false
      - name: Validate GitHub Actions syntax and expressions
        shell: bash
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/capture-cbr-offices.yml \
            .github/workflows/validate-cbr-offices.yml \
            .github/workflows/check-cbr-offices.yml \
            .github/workflows/capture-cbr-offices-reg.yml
      - name: Run offline extractor and publishing tests
        shell: bash
        run: python -m unittest discover -s tests -p 'test_capture_cbr_offices*.py' -q
      - name: Live read-only CBR HTML extraction smoke test
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cbr-offices-acceptance"
          python scripts/capture_cbr_offices.py capture \
            --output-dir "$RUNNER_TEMP/cbr-offices-acceptance"
          shopt -s nullglob
          files=("$RUNNER_TEMP"/cbr-offices-acceptance/????-??-??_OFFICES.csv)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Capture must create exactly one CSV"
            exit 1
          fi
          python scripts/capture_cbr_offices.py validate --file "${files[0]}"

      - name: Live read-only CBR monthly XLSX conversion smoke test
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from scripts import capture_cbr_offices_reg as m
          html = m.download(m.SOURCE_PAGE, m.LIMIT_HTML, {"text/html", "application/xhtml+xml"})
          links = m.discover(html.decode("utf-8-sig"))
          period = max(links)
          xlsx = m.download(links[period], m.LIMIT_XLSX, {
              "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              "application/octet-stream", "application/zip"
          })
          from pathlib import Path
          Path("/tmp/cbr-reg-acceptance-sample.xlsx").write_bytes(xlsx)
          result = m.convert_xlsx(xlsx)
          rows = m.validate_csv(result)
          print(f"REGIONAL_LIVE_CONVERSION_OK reference_date={period} rows={rows}")
          PY
      - name: Short-lived official XLSX acceptance sample
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbr-reg-acceptance-sample
          path: /tmp/cbr-reg-acceptance-sample.xlsx
          retention-days: 1
          if-no-files-found: warn
