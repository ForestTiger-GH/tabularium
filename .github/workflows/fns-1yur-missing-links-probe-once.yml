name: One-shot FNS 1-YUR missing links audit (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-missing-links-probe-once.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Inspect original official monthly links
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          import capture_fns_1yur_history as h
          for year, targets in (
              (2013,("01.08.2013","01.09.2013","01.10.2013")),
              (2015,("01.03.2015",)),
          ):
              page=h.BASE+h.YEAR_PAGES[year]+"/"
              parser=h.ListParser()
              parser.feed(h.retrieve(page,page=True).decode("utf-8-sig"))
              for label,links in parser.items:
                  if any(t in label for t in targets):
                      print("MISSING_SOURCE_ITEM",year,repr(label.strip()[:300]))
                      for link in links:
                          print("MISSING_SOURCE_HREF",year,repr(link))
          PY
