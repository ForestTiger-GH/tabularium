name: One-shot FNS 1-YUR legacy links validation (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-missing-links-probe-once.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install legacy source readers
        run: |
          pip install -r scripts/requirements_fns_1yur.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libarchive-tools
      - name: Recover August 2013 official RAR
        run: python scripts/backfill_fns_1yur_history.py --from-date 2013-08-01 --to-date 2013-08-01 --dry-run
      - name: Recover September 2013 official RAR
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2013-09-01 --to-date 2013-09-01 --dry-run
      - name: Recover October 2013 official RAR
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2013-10-01 --to-date 2013-10-01 --dry-run
      - name: Recover March 2015 official RAR
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2015-03-01 --to-date 2015-03-01 --dry-run
