name: One-shot FNS 1-YUR canonical live source check (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-canonical-live-check-once.yml']
permissions:
  contents: read
concurrency:
  group: tabularium-publication-monitor
  cancel-in-progress: false
  queue: single
jobs:
  check:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install published XLS source readers
        run: python -m pip install --disable-pip-version-check -r scripts/requirements_fns_1yur.txt
      - name: Verify migrated corpus and event log
        run: |
          python scripts/migrate_fns_1yur_canonical.py verify
          python _mw/work/publication-monitor/fns_1yur_pipeline.py verify
      - name: Fetch official recent releases and compare canonical source values
        run: python _mw/work/publication-monitor/fns_1yur_pipeline.py dry-run
