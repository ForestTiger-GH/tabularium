name: One-shot FNS 1-YUR remaining-gap diagnosis (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-remaining-gaps-once.yml']
permissions:
  contents: read
concurrency:
  group: tabularium-fns-1yur-remaining-gap-check
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install narrow legacy XLS readers
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements_fns_1yur.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libarchive-tools
      - name: New OOXML and source-scope tests
        run: |
          python -m unittest discover -s tests -p 'test_capture_fns_1yur_legacy_ooxml.py' -q
          python -m unittest discover -s tests -p 'test_repair_fns_1yur_history_scope.py' -q
      - name: Recover July 2017 archive
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2017-07-01 --to-date 2017-07-01 --dry-run
      - name: Recover July 2016 archive
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2016-07-01 --to-date 2016-07-01 --dry-run
      - name: Recover November 2016 archive
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2016-11-01 --to-date 2016-11-01 --dry-run
      - name: Recover November 2017 archive
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2017-11-01 --to-date 2017-11-01 --dry-run
      - name: Inspect July 2015 RAR and September 2016 source
        if: always()
        run: |
          python - <<'PY'
          import sys,io,zipfile,subprocess,tempfile
          from pathlib import Path
          from datetime import date
          from urllib.request import urlopen,Request
          sys.path.insert(0,"scripts")
          import capture_fns_1yur_history as h
          for d in (date(2015,7,1),date(2016,9,1)):
              found,_=h.discover(d,d)
              page,asset=found[d]
              print("GAP_SOURCE",d,asset)
              with urlopen(Request(asset,headers={"User-Agent":"Mozilla/5.0"}),timeout=35) as resp:
                  content=resp.read(30000000)
                  print("GAP_SOURCE_BYTES",d,len(content),content[:85].hex(),repr(content[:85]),
                        "content_type",resp.headers.get("Content-Type"))
              if content.startswith(b"Rar!"):
                  with tempfile.TemporaryDirectory() as tmp:
                      path=Path(tmp)/"src.rar";path.write_bytes(content)
                      out=subprocess.run(["bsdtar","-tf",str(path)],capture_output=True,text=True,
                                         errors="replace",timeout=20)
                      print("GAP_RAR_LIST",d,out.returncode,out.stdout[:2500],out.stderr[:500])
              if content.startswith(b"PK"):
                  with zipfile.ZipFile(io.BytesIO(content)) as archive:
                      print("GAP_ZIP_LIST",d,archive.namelist()[:20])
          PY
      - name: Inspect canonical source order in June 2019
        if: always()
        run: |
          python - <<'PY'
          import sys
          from datetime import date
          sys.path.insert(0,"scripts")
          import capture_fns_1yur_history as h
          day=date(2019,6,1)
          sources,_=h.discover(day,day)
          page,asset=sources[day]
          raw,member,format_name=h.workbook_from_asset(h.retrieve(asset),asset)
          book=h.open_source_workbook(raw)
          try:
              orders={}
              for kind in ("1000","1100","1130"):
                  sh=book.sheet_by_name(kind)
                  nr=h._header_row(sh)
                  orders[kind]=[g for row in range(nr+1,sh.nrows) if (g:=h._geography(sh,row))]
              baseline=orders["1000"]
              for kind,order in orders.items():
                  print("GAP_GEO",kind,"rows",len(order),
                    "missing_from_kind",list(set(baseline)-set(order))[:15],
                    "extra_in_kind",list(set(order)-set(baseline))[:15],
                    "first_diff",next(((i,a,b) for i,(a,b) in enumerate(zip(baseline,order)) if a!=b),None))
          finally:
              book.release_resources()
          PY
