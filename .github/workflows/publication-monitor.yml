name: Monitor official sources and capture FNS SME and 1-YUR statistics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Offline validation, network dry-run, baseline, check, or Telegram test'
        required: true
        type: choice
        default: 'dry-run'
        options:
          - validate
          - dry-run
          - bootstrap
          - check
          - test-telegram
          - fns-dry-run
          - fns-backfill
          - fns-verify
          - fns-1yur-dry-run
          - fns-1yur-verify
          - fns-1yur-backfill
          - fns-1yur-check
      fns_from_date:
        description: 'FNS backfill first official date (YYYY-MM-DD)'
        required: false
        type: string
      fns_to_date:
        description: 'FNS SME backfill last official date (YYYY-MM-DD)'
        required: false
        type: string
      fns_1yur_from_date:
        description: 'FNS 1-YUR backfill first source date (YYYY-MM-DD)'
        required: false
        type: string
      fns_1yur_to_date:
        description: 'FNS 1-YUR backfill last source date (YYYY-MM-DD)'
        required: false
        type: string

  schedule:
    # Fixed UTC slots. At UTC+03: 04:00, 08:48, 13:36, 18:24, 23:12.
    # No daylight saving changes. GitHub scheduled dispatch is best-effort.
    - cron: '0 1 * * *'
    - cron: '48 5 * * *'
    - cron: '36 10 * * *'
    - cron: '24 15 * * *'
    - cron: '12 20 * * *'

permissions:
  contents: write

concurrency:
  group: tabularium-publication-monitor
  cancel-in-progress: false
  # One active plus one pending; a newer pending run replaces an older one.
  queue: single

jobs:
  monitor:
    if: >-
      github.repository == 'ForestTiger-GH/tabularium' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      (github.event_name == 'schedule' || !startsWith(inputs.mode, 'fns-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Offline schema and behavior checks
        shell: bash
        run: |
          python _mw/work/publication-monitor/monitor.py validate
          python -m unittest discover -s _mw/work/publication-monitor/tests -p 'test_*.py' -q
      - name: Check configured sources
        id: scan
        shell: bash
        env:
          MONITOR_MODE: ${{ github.event_name == 'schedule' && 'check' || inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
        run: |
          case "$MONITOR_MODE" in
            validate) python _mw/work/publication-monitor/monitor.py validate ;;
            dry-run) python _mw/work/publication-monitor/monitor.py check --dry-run ;;
            bootstrap|check|test-telegram) python _mw/work/publication-monitor/monitor.py "$MONITOR_MODE" ;;
            *) echo 'Invalid monitor mode' >&2; exit 2 ;;
          esac
      - name: Publish only successful checkpoints
        if: >-
          ${{ always() && !cancelled() && steps.scan.outcome != 'skipped' &&
              (github.event_name == 'schedule' || inputs.mode == 'bootstrap' || inputs.mode == 'check') }}
        shell: bash
        run: |
          set -euo pipefail
          STATE=_mw/work/publication-monitor/state.json
          MONITOR=_mw/work/publication-monitor
          BASE=$(git rev-parse HEAD)
          git add -- "$STATE"
          if git diff --cached --quiet; then
            echo 'No checkpoint changes; no commit.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(monitor): advance observed source hashes'
          for attempt in 1 2 3; do
            git fetch origin main
            # Abort if any monitor inputs or checkpoints have changed since scanning.
            if ! git diff --quiet "$BASE" origin/main -- "$MONITOR" .github/workflows/publication-monitor.yml; then
              echo 'Monitor inputs or state changed concurrently: refusing to overwrite.' >&2
              exit 1
            fi
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                rebase origin/main
            if git push origin HEAD:main; then
              echo 'Updated monitor checkpoints.'
              exit 0
            fi
            echo "Non-fast-forward push attempt $attempt; checking repository again." >&2
          done
          echo 'Unable to publish checkpoints; a notification may repeat.' >&2
          exit 1


  fns-sme:
    needs: monitor
    if: >-
      always() && !cancelled() &&
      github.repository == 'ForestTiger-GH/tabularium' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      (github.event_name == 'schedule' ||
       inputs.mode == 'check' || inputs.mode == 'dry-run' ||
       inputs.mode == 'validate' ||
       inputs.mode == 'fns-dry-run' || inputs.mode == 'fns-backfill' ||
       inputs.mode == 'fns-verify')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the current main after XLSX monitoring
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Offline source and pipeline validation
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_capture_fns_sme.py' -q
          python -m unittest discover -s _mw/work/publication-monitor/tests -p 'test_fns_sme_pipeline.py' -q
      - name: Check, publish and notify FNS SME releases
        shell: bash
        env:
          FNS_MODE: ${{ github.event_name == 'schedule' && 'check' || inputs.mode }}
          FNS_FROM: ${{ inputs.fns_from_date || '' }}
          FNS_TO: ${{ inputs.fns_to_date || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
        run: |
          set -euo pipefail
          case "$FNS_MODE" in
            check) python _mw/work/publication-monitor/fns_sme_pipeline.py check ;;
            validate) python _mw/work/publication-monitor/fns_sme_pipeline.py validate ;;
            dry-run|fns-dry-run) python _mw/work/publication-monitor/fns_sme_pipeline.py dry-run ;;
            fns-verify) python _mw/work/publication-monitor/fns_sme_pipeline.py verify ;;
            fns-backfill)
              if [ -z "$FNS_FROM" ] || [ -z "$FNS_TO" ]; then
                echo 'FNS backfill requires both range dates' >&2; exit 2
              fi
              python _mw/work/publication-monitor/fns_sme_pipeline.py backfill \
                --from-date "$FNS_FROM" --to-date "$FNS_TO"
              ;;
            *) echo 'Invalid FNS mode' >&2; exit 2 ;;
          esac

  fns-1yur:
    needs: fns-sme
    if: >-
      always() && !cancelled() &&
      github.repository == 'ForestTiger-GH/tabularium' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false &&
      (github.event_name == 'schedule' ||
       inputs.mode == 'check' || inputs.mode == 'dry-run' ||
       inputs.mode == 'validate' ||
       inputs.mode == 'fns-1yur-check' ||
       inputs.mode == 'fns-1yur-dry-run' ||
       inputs.mode == 'fns-1yur-verify' ||
       inputs.mode == 'fns-1yur-backfill')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current main after other monitor jobs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install narrowly scoped XLS dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check -r scripts/requirements_fns_1yur.txt
      - name: Offline FNS 1-YUR tests
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_capture_fns_1yur.py' -q
          python -m unittest discover -s tests -p 'test_capture_fns_1yur_history.py' -q
          python -m unittest discover -s _mw/work/publication-monitor/tests -p 'test_fns_1yur_pipeline.py' -q
      - name: Check, publish, and notify FNS 1-YUR releases
        shell: bash
        env:
          FNS_1YUR_MODE: ${{ github.event_name == 'schedule' && 'check' || inputs.mode }}
          FNS_1YUR_FROM: ${{ inputs.fns_1yur_from_date || '' }}
          FNS_1YUR_TO: ${{ inputs.fns_1yur_to_date || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
        run: |
          set -euo pipefail
          case "$FNS_1YUR_MODE" in
            check|fns-1yur-check) python _mw/work/publication-monitor/fns_1yur_pipeline.py check ;;
            validate) python _mw/work/publication-monitor/fns_1yur_pipeline.py validate ;;
            dry-run|fns-1yur-dry-run) python _mw/work/publication-monitor/fns_1yur_pipeline.py dry-run ;;
            fns-1yur-verify) python _mw/work/publication-monitor/fns_1yur_pipeline.py verify ;;
            fns-1yur-backfill)
              if [ -z "$FNS_1YUR_FROM" ] || [ -z "$FNS_1YUR_TO" ]; then
                echo '1-YUR backfill requires both range dates' >&2; exit 2
              fi
              python _mw/work/publication-monitor/fns_1yur_pipeline.py backfill \
                --from-date "$FNS_1YUR_FROM" --to-date "$FNS_1YUR_TO"
              ;;
            *) echo 'Invalid 1-YUR mode' >&2; exit 2 ;;
          esac
