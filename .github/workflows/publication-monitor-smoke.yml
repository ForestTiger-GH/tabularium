name: Publication monitor official-host fallback probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publication-monitor-smoke.yml'

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'ForestTiger-GH/tabularium' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Probe alternate official CBR host for four HTTP 403 sources
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          p = Path('_mw/work/publication-monitor/monitor.py')
          spec = importlib.util.spec_from_file_location('publication_probe', p)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          targets = {
              'debt_structure_benchmark_rate', 'households_bm',
              'households_om', 'exchange_rate'
          }
          for source in m.load_registry():
              if source['id'] not in targets:
                  continue
              old = urlsplit(source['url'])
              alt = urlunsplit((old.scheme, 'www.cbr.ru', old.path, old.query, old.fragment))
              try:
                  digest, final_url, count = m.download_hash(alt, source['publisher'])
                  print('OFFICIAL_HOST_FALLBACK_OK', source['id'], count, digest[:12])
              except m.MonitorError as exc:
                  print('OFFICIAL_HOST_FALLBACK_FAILED', source['id'], str(exc))
          PY
