name: One-shot FNS 1-YUR historical schema recovery (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-schema-recovery-check-once.yml']
permissions:
  contents: read
concurrency:
  group: tabularium-fns-1yur-recovery-validation
  cancel-in-progress: false
jobs:
  test:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install source-only XLS readers
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements_fns_1yur.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libarchive-tools
      - name: Offline source regression tests
        run: |
          python -m unittest discover -s tests -p 'test_capture_fns_1yur*.py' -q
          python -m unittest discover -s tests -p 'test_repair_fns_1yur_history_scope.py' -q
          python -m unittest discover -s _mw/work/publication-monitor/tests -p 'test_fns_1yur_pipeline.py' -q
      - name: Recover mislabelled OOXML April 2018
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2018-04-01 --to-date 2018-04-01 --dry-run
      - name: Recover mislabelled OOXML February 2019
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2019-02-01 --to-date 2019-02-01 --dry-run
      - name: Recover differing regional control sheet November 2013
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2013-11-01 --to-date 2013-11-01 --dry-run
      - name: Recover different worksheet geography order June 2019
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2019-06-01 --to-date 2019-06-01 --dry-run
      - name: Diagnose problematic July 2015, September 2016, July 2017 sources
        if: always()
        run: |
          python - <<'PY'
          import sys,io,zipfile
          from datetime import date
          sys.path.insert(0,"scripts")
          import capture_fns_1yur_history as h
          for d in (date(2015,7,1),date(2016,9,1),date(2017,7,1)):
              r,errors=h.discover(d,d)
              if d not in r:
                  print("FNS_UNRESOLVED_DATE",d,errors);continue
              page,asset=r[d]
              print("FNS_UNRESOLVED_ASSET",d,asset)
              try:
                  data=h.retrieve(asset)
                  print("FNS_UNRESOLVED_SIGNATURE",d,data[:18].hex(),len(data))
                  if data.startswith(bytes.fromhex("504b0304")):
                      with zipfile.ZipFile(io.BytesIO(data)) as z:
                          print("FNS_UNRESOLVED_MEMBERS",d,z.namelist()[:20])
                          for item in z.infolist()[:7]:
                              if not item.is_dir():
                                  print("FNS_MEMBER_MAGIC",d,item.filename,z.read(item)[:15].hex())
              except Exception as exc:
                  print("FNS_UNRESOLVED_REASON",d,type(exc).__name__,str(exc))
          PY
