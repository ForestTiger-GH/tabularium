name: One-shot FNS 1-YUR canonical preflight (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-canonical-preflight-once.yml']
permissions:
  contents: read
concurrency:
  group: tabularium-publication-monitor
  cancel-in-progress: false
  queue: single
jobs:
  preflight:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install reviewed legacy readers
        run: python -m pip install --disable-pip-version-check -r scripts/requirements_fns_1yur.txt
      - name: Compile and test all FNS 1-YUR extraction and publication components
        run: |
          python -m py_compile scripts/fns_1yur_semantics.py scripts/migrate_fns_1yur_canonical.py scripts/capture_fns_1yur.py scripts/capture_fns_1yur_history.py scripts/backfill_fns_1yur_history.py _mw/work/publication-monitor/fns_1yur_pipeline.py
          python -m unittest discover -s tests -p 'test_capture_fns_1yur.py' -q
          python -m unittest discover -s tests -p 'test_capture_fns_1yur_history.py' -q
          python -m unittest discover -s tests -p 'test_capture_fns_1yur_legacy_ooxml.py' -q
          python -m unittest discover -s tests -p 'test_fns_1yur_semantics.py' -v
          python -m unittest discover -s tests -p 'test_repair_fns_1yur_history_scope.py' -q
          python -m unittest discover -s _mw/work/publication-monitor/tests -p 'test_fns_1yur_pipeline.py' -q
          python _mw/work/publication-monitor/fns_1yur_pipeline.py verify
      - name: Inspect complete 178-date migration without editing files
        run: python scripts/migrate_fns_1yur_canonical.py dry-run
