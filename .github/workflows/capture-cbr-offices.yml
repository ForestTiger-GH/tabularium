name: Capture CBR credit institution offices

on:
  workflow_dispatch:
  schedule:
    # 01:17 UTC = 04:17 in fixed UTC+03:00, without daylight-saving changes.
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: cbr-offices-daily
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.repository == 'ForestTiger-GH/tabularium' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      csv_sha256: ${{ steps.capture_csv.outputs.csv_sha256 }}
    steps:
      - name: Checkout immutable workflow commit (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify offline extractor and publication contracts
        shell: bash
        run: python -m unittest discover -s tests -p 'test_capture_cbr_offices.py' -q
      - name: Capture source-faithful CSV
        id: capture_csv
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cbr-offices"
          python scripts/capture_cbr_offices.py capture \
            --output-dir "$RUNNER_TEMP/cbr-offices" \
            --github-output "$GITHUB_OUTPUT"
      - name: Transfer one short-lived CSV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cbr-offices-csv
          path: ${{ runner.temp }}/cbr-offices/OFFICES_*.csv
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: capture
    if: >-
      github.repository == 'ForestTiger-GH/tabularium' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout the same immutable workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.12 (no parser dependencies)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download the single captured artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cbr-offices-csv
          path: ${{ runner.temp }}/cbr-offices-input
      - name: Revalidate artifact and publish one immutable CSV
        env:
          EXPECTED_CSV_SHA256: ${{ needs.capture.outputs.csv_sha256 }}
          EXPECTED_CODE_COMMIT: ${{ github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          python scripts/capture_cbr_offices.py publish \
            --input-dir "$RUNNER_TEMP/cbr-offices-input" \
            --corpus-root scrolls/russia/authorities/bank-of-russia/credit-institution-structural-units
