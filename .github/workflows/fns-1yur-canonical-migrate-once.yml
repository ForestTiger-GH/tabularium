name: One-shot FNS 1-YUR canonical migration (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-canonical-migrate-once.yml']
permissions:
  contents: write
concurrency:
  group: tabularium-publication-monitor
  cancel-in-progress: false
  queue: single
jobs:
  migrate:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out current public main, preserving history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Source tests and fail-closed dry run
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_fns_1yur_semantics.py' -q
          python -m unittest discover -s _mw/work/publication-monitor/tests -p 'test_fns_1yur_pipeline.py' -q
          python scripts/migrate_fns_1yur_canonical.py dry-run
      - name: Stage all 178 source-faithful canonical CSVs and their exact lineage
        run: |
          set -euo pipefail
          python scripts/migrate_fns_1yur_canonical.py migrate
          python scripts/migrate_fns_1yur_canonical.py verify
          python _mw/work/publication-monitor/fns_1yur_pipeline.py verify
          git diff --check
      - name: Publish one atomic commit, including all dated hashes and mapping
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BASE=$(git rev-parse HEAD)
          git add -- scrolls/russia/authorities/federal-tax-service/legal-entity-registration/ \
                     _mw/work/publication-monitor/fns_1yur_events.jsonl
          test "$(git diff --cached --name-only -- 'scrolls/russia/authorities/federal-tax-service/legal-entity-registration/*/*_1-YUR.csv' | wc -l)" -eq 178
          test -f scrolls/russia/authorities/federal-tax-service/legal-entity-registration/field-provenance.json
          git diff --cached --check
          git commit -m 'data(fns): harmonize 178 1-YUR CSVs with reported-only canonical field names'
          git fetch origin main
          if ! git diff --quiet "$BASE" origin/main -- \
              scrolls/russia/authorities/federal-tax-service/legal-entity-registration/ \
              _mw/work/publication-monitor/fns_1yur_events.jsonl \
              scripts/fns_1yur_semantics.py \
              scripts/migrate_fns_1yur_canonical.py \
              scripts/capture_fns_1yur.py; then
            echo 'Concurrent source/map/corpus change: publication blocked.' >&2
            exit 2
          fi
          git rebase origin/main
          git push origin HEAD:main
