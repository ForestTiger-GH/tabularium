name: One-shot FNS 1-YUR history validation (public only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fns-1yur-history-once.yml']
permissions:
  contents: read
concurrency:
  group: tabularium-fns-1yur-history-probe
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'ForestTiger-GH/tabularium' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install legacy archive reader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libarchive-tools
      - name: Install XLS reader
        run: pip install -r scripts/requirements_fns_1yur.txt
      - name: Existing FNS unit tests
        run: |
          python -m unittest discover -s tests -p 'test_capture_fns_1yur.py' -q
          python -m unittest discover -s _mw/work/publication-monitor/tests -p 'test_fns_1yur_pipeline.py' -q
      - name: Inspect non-OLE publisher members (read only)
        run: |
          python - <<'PY'
          import sys, io, zipfile
          from datetime import date
          sys.path.insert(0,"scripts")
          import capture_fns_1yur_history as h
          for day in (date(2018,4,1),date(2019,2,1)):
              found,_=h.discover(day,day)
              page,url=found[day]
              body=h.retrieve(url)
              print("UNUSUAL_ASSET",day,url,body[:18].hex())
              with zipfile.ZipFile(io.BytesIO(body)) as z:
                  for info in z.infolist():
                      if info.is_dir():continue
                      raw=z.read(info)
                      print("UNUSUAL_MEMBER",day,info.filename,info.file_size,
                            "prefix",raw[:60].hex(),"first_text",repr(raw[:150]))
          PY
      - name: Validate first 2012 releases
        run: python scripts/backfill_fns_1yur_history.py --from-date 2012-01-01 --to-date 2012-12-01 --max-releases 3 --dry-run
      - name: Validate 2018 historical classification
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2018-01-01 --to-date 2018-12-01 --max-releases 1 --dry-run
      - name: Validate corrected April 2018 archive path
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2018-04-01 --to-date 2018-04-01 --dry-run
      - name: Validate corrected April 2019 archive path
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2019-04-01 --to-date 2019-04-01 --dry-run
      - name: Validate corrected November 2023 archive path
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2023-11-01 --to-date 2023-11-01 --dry-run
      - name: Validate 2022 historical indicator mapping
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2022-01-01 --to-date 2022-12-01 --max-releases 1 --dry-run
      - name: Validate 2024 historical indicator mapping
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2024-01-01 --to-date 2024-12-01 --max-releases 1 --dry-run
      - name: Validate 2026 current schema
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2026-10-01 --to-date 2026-11-01 --max-releases 1 --dry-run
      - name: Validate 2016 classification and RAR archive
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2016-01-01 --to-date 2016-12-01 --max-releases 1 --dry-run
      - name: Validate 2019 transition
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2019-01-01 --to-date 2019-12-01 --max-releases 1 --dry-run
      - name: Validate 2020 classification
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2020-01-01 --to-date 2020-12-01 --max-releases 1 --dry-run
      - name: Validate 2023 classification
        if: always()
        run: python scripts/backfill_fns_1yur_history.py --from-date 2023-01-01 --to-date 2023-12-01 --max-releases 1 --dry-run
      - name: Regular monitor dry run (2026)
        if: always()
        run: python _mw/work/publication-monitor/fns_1yur_pipeline.py dry-run

